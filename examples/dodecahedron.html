<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PolyFaceLib — dodecahedron</title>
  <link rel="stylesheet" href="./_shared.css" />
  <link rel="stylesheet" href="../dist/styles.css" />
</head>
<body>
  <div class="example-page">
    <header>
      <h1>Dodécaèdre — 12 faces pentagonales</h1>
      <p>Touches numériques 1–5 pour naviguer (mode keyboard.numeric).</p>
    </header>
    <main><div class="viewer" id="viewer"></div></main>
    <footer>Demo 3/14</footer>
  </div>
  <script type="module">
    import { PolyFaceLib, Polyhedra } from '../dist/index.js';
    const view = new PolyFaceLib({
      container: '#viewer',
      polyhedron: Polyhedra.dodecahedron(),
      perspective: 1200,
      interaction: { keyboard: { enabled: true, mode: 'numeric' } },
    });
    const tints = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#a855f7', '#ec4899', '#14b8a6', '#84cc16', '#f97316', '#3b82f6', '#eab308'];
    for (let i = 0; i < 12; i++) {
      view.setFace(i, {
        type: 'html',
        html: `<div style="height:100%;background:${tints[i]};display:grid;place-items:center">
          <strong style="font-size:32px">${i + 1}</strong>
        </div>`,
      });
    }
    view.start();
    document.getElementById('viewer').focus();
  </script>
</body>
</html>
